const R=/([\u4e00-\u9fff々]+)\{([^}]+)\}/g;
const rb=s=>s.replace(R,"<ruby>$1<rt>$2</rt></ruby>"), sp=s=>s.replace(R,"$2");
const E={"う":"え","く":"け","ぐ":"げ","す":"せ","つ":"て","ぬ":"ね","ぶ":"べ","む":"め","る":"れ"};
function cond(v){const d=v[0];if(d==="ある")return"あれば";if(d==="来{く}る")return"来{く}れば";if(/する$/.test(d))return d.slice(0,-2)+"すれば";if(v[2]===2)return d.slice(0,-1)+"れば";return d.slice(0,-1)+E[d.slice(-1)]+"ば"}
let voice=null;
function pick(){voice=(speechSynthesis.getVoices()||[]).find(v=>v.lang&&v.lang.toLowerCase().startsWith("ja"))||null}
try{pick();speechSynthesis.onvoiceschanged=pick}catch(e){}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(sp(t));u.lang="ja-JP";if(voice)u.voice=voice;u.rate=+document.getElementById("rate").value;speechSynthesis.speak(u)}catch(e){}}
const list=document.getElementById("list");
let fav=new Set();
try{fav=new Set(JSON.parse(localStorage.getItem("jpverbs-fav")||"[]"))}catch(e){}
function saveFav(){try{localStorage.setItem("jpverbs-fav",JSON.stringify([...fav]))}catch(e){}}
const jump=document.getElementById("jump");
function render(){
 const q=document.getElementById("q").value.trim().toLowerCase(),lv=document.getElementById("lv").value;
 list.innerHTML="";const vis=[];
 V.forEach((v,i)=>{
  if(lv==="fav"){if(!fav.has(v[0]))return}else if(lv&&v[3]!==lv)return;
  if(q&&!(sp(v[0])+v[1]+v[0]).toLowerCase().includes(q))return;
  const c=document.createElement("div");c.className="card";c.id="v"+i;vis.push([i,v]);
  let h=`<div class="head"><button class="play" data-t="${v[0]}" aria-label="Play">▶</button><span class="big">${rb(v[0])}</span><span class="tag">${v[3]}</span><span class="tag">Group ${v[2]}</span><span class="en">${v[1]}</span><button class="star${fav.has(v[0])?" on":""}" data-fav="${v[0]}" aria-label="Favorite">${fav.has(v[0])?"★":"☆"}</button></div><div class="forms">`;
  for(let k=0;k<5;k++)if(v[4+k])h+=`<div class="f" data-t="${v[4+k]}"><small>${L[k]}</small>${rb(v[4+k])}</div>`;
  const cd=cond(v);h+=`<div class="f" data-t="${cd}"><small>条件形 (ば)</small>${rb(cd)}</div></div>`;
  v[9].forEach((s,k)=>{h+=`<div class="s"><button class="play" data-t="${s[0]}" aria-label="Play">▶</button><div><b>${L[k]}</b><div class="jp">${rb(s[0])}</div><div class="en en2">${s[1]}</div></div></div>`});
  const cs=C[v[0]];if(cs){const cj=cs[0].replace("~",cd);h+=`<div class="s"><button class="play" data-t="${cj}" aria-label="Play">▶</button><div><b>条件形 (ば conditional)</b><div class="jp">${rb(cj)}</div><div class="en en2">${cs[1]}</div></div></div>`}
  c.innerHTML=h;list.appendChild(c);
 });
 jump.innerHTML='<option value="">Jump to verb…</option>'+vis.map(([i,v])=>'<option value="'+i+'">'+sp(v[0])+' ('+v[1]+')</option>').join("");
 if(!list.children.length)list.innerHTML='<p class="note">'+(lv==="fav"?"No favorites yet. Tap ☆ on a verb to add it.":"No verbs match.")+'</p>';
}
list.addEventListener("click",e=>{
 const f=e.target.closest("[data-fav]");
 if(f){const k=f.dataset.fav;fav.has(k)?fav.delete(k):fav.add(k);saveFav();
  if(document.getElementById("lv").value==="fav"){render()}else{const on=fav.has(k);f.classList.toggle("on",on);f.textContent=on?"★":"☆"}
  return}
 const t=e.target.closest("[data-t]");if(t)say(t.dataset.t)});
jump.onchange=function(){const el=document.getElementById("v"+this.value);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});this.value=""};
document.getElementById("fg").onclick=function(){const h=document.body.classList.toggle("nofg");this.textContent="Furigana: "+(h?"off":"on")};
document.getElementById("q").oninput=render;document.getElementById("lv").onchange=render;
document.getElementById("tg").onclick=function(){const h=list.classList.toggle("hide");this.textContent="English: "+(h?"off":"on")};
render();
</script></body></html>
