  if(q&&!(x.w+x.r+x.m+x.t+plain(x.s)).toLowerCase().includes(q))return"";
  n++;const f=favs.has(x.w);
  return `<div class="card"><div class="top"><span class="w">${esc(x.w)}</span><span class="r">${esc(x.r)}</span>${x.l?`<span class="t">L${esc(x.l)}</span>`:""}<span class="sp"></span><button onclick="say(${i},0)" aria-label="Play word">🔊</button><button class="star ${f?"f":""}" onclick="fav(${i})" aria-label="Favorite">${f?"★":"☆"}</button></div><div class="m" onclick="this.classList.toggle('v')">${esc(x.m)}</div>${x.s?`<div class="s"><button onclick="say(${i},1)" aria-label="Play sentence">🔊</button><div><div class="jp">${rb(x.s)}</div><div class="t" onclick="this.classList.toggle('v')">${esc(x.t)}</div></div></div>`:""}</div>`}).join("")||`<p class="t">${filt?"No favorites yet — tap ☆ on a word.":"No matches."}</p>`;
 $("cnt").textContent=`${n} of ${words.length} words · ${favs.size} favorites`;
}
function addWords(){
 const a=parse($("imp").value);
 if(!a.length){$("msg").textContent="Need 5 fields per line, separated by |";return}
 extra.push(...a);build();save();$("imp").value="";$("msg").textContent=`Processed ${a.length} lines`;render();
}
build();lessons();render();
</script></body></html>
