const $=id=>document.getElementById(id);
const rb=s=>esc(s).replace(/\{([^:}]+):([^}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>');
const plain=s=>s.replace(/\{([^:}]+):([^}]+)\}/g,'$1');
const parse=t=>t.split("\n").map(l=>l.trim().split("|")).filter(a=>a.length>=5).map(a=>({w:a[0],r:a[1],m:a[2],s:a[3],t:a[4]}));
let extra=[],favs=new Set(),filt=0,hide=false;
try{extra=JSON.parse(localStorage.getItem("n4x")||"[]")}catch(e){}
try{favs=new Set(JSON.parse(localStorage.getItem("n4f")||"[]"))}catch(e){}
let words=[];
function build(){const seen=new Set();words=[...parse(BASE),...extra].filter(x=>!seen.has(x.w)&&seen.add(x.w))}
function save(){try{localStorage.setItem("n4f",JSON.stringify([...favs]));localStorage.setItem("n4x",JSON.stringify(extra))}catch(e){}}
let voice=null;
function pick(){const v=speechSynthesis.getVoices();voice=v.find(x=>/^ja/i.test(x.lang))||null}
if("speechSynthesis" in window){pick();speechSynthesis.onvoiceschanged=pick}
function say(i,k){
 if(!("speechSynthesis" in window)){alert("Audio isn't supported in this browser.");return}
 const x=words[i];speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(k?plain(x.s):(x.r||x.w));
 u.lang="ja-JP";u.rate=.85;if(voice)u.voice=voice;speechSynthesis.speak(u);
}
function fav(i){const w=words[i].w;favs.has(w)?favs.delete(w):favs.add(w);save();render()}
function setF(f){filt=f;$("bAll").className=f?"":"on";$("bFav").className=f?"on":"";render()}
function toggleFur(){document.body.classList.toggle('nofur');$('bFur').className=document.body.classList.contains('nofur')?'':'on'}
function toggleHide(){hide=!hide;$("bHide").className=hide?"on":"";render()}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function render(){
 const q=$("q").value.trim().toLowerCase();
 let n=0;
 $("list").className=hide?"hide":"";
 $("list").innerHTML=words.map((x,i)=>{
  if(filt&&!favs.has(x.w))return"";
  if(q&&!(x.w+x.r+x.m+x.t+plain(x.s)).toLowerCase().includes(q))return"";
  n++;const f=favs.has(x.w);
  return `<div class="card"><div class="top"><span class="w">${esc(x.w)}</span><span class="r">${esc(x.r)}</span><span class="sp"></span><button onclick="say(${i},0)" aria-label="Play word">🔊</button><button class="star ${f?"f":""}" onclick="fav(${i})" aria-label="Favorite">${f?"★":"☆"}</button></div><div class="m" onclick="this.classList.toggle('v')">${esc(x.m)}</div><div class="s"><button onclick="say(${i},1)" aria-label="Play sentence">🔊</button><div><div class="jp">${rb(x.s)}</div><div class="t" onclick="this.classList.toggle('v')">${esc(x.t)}</div></div></div></div>`}).join("")||`<p class="t">${filt?"No favorites yet — tap ☆ on a word.":"No matches."}</p>`;
 $("cnt").textContent=`${n} of ${words.length} words · ${favs.size} favorites`;
}
function addWords(){
 const a=parse($("imp").value);
 if(!a.length){$("msg").textContent="Need 5 fields per line, separated by |";return}
 extra.push(...a);build();save();$("imp").value="";$("msg").textContent=`Processed ${a.length} lines`;render();
}
build();render();
</script></body></html>
